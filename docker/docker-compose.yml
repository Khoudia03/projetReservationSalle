services:

  php:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: reservation-php
    volumes:
      - ..:/var/www/html
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: reservation-nginx
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: reservation-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reservation_salles
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: