name: Publish Docker image for Git tags

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Docker files exist
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os

          if not os.path.exists('Dockerfile'):
              with open('Dockerfile', 'w', encoding='utf-8') as f:
                  f.write('''FROM php:8.3-fpm\n\nWORKDIR /var/www/html\n\nCOPY . .\n\nRUN apt-get update \\\n    && apt-get install -y git unzip libzip-dev \\\n    && docker-php-ext-install pdo pdo_mysql zip \\\n    && rm -rf /var/lib/apt/lists/*\n\nCOPY --from=composer:2 /usr/bin/composer /usr/bin/composer\n\nRUN composer install --no-dev --optimize-autoloader\n\nCMD ["php-fpm"]\n''')

          if not os.path.exists('docker-compose.yml'):
              with open('docker-compose.yml', 'w', encoding='utf-8') as f:
                  f.write('''services:\n  app:\n    build: .\n    ports:\n      - "8080:80"\n''')
          PY

          echo "Final Docker files:"
          ls -l Dockerfile docker-compose.yml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image for Git tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO || 'projetreservation' }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO || 'projetreservation' }}:latest
