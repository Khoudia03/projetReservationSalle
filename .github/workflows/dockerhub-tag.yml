name: Publish Docker image for Git tags

'on':
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      publish_all:
        description: 'Publier aussi tous les tags historiques'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    env:
      DOCKER_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO || 'projetreservation' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Docker files exist
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os

          if not os.path.exists('Dockerfile'):
              with open('Dockerfile', 'w', encoding='utf-8') as f:
                  f.write('''FROM php:8.3-fpm\n\nWORKDIR /var/www/html\n\nCOPY . .\n\nRUN apt-get update \\\n    && apt-get install -y git unzip libzip-dev \\\n    && docker-php-ext-install pdo pdo_mysql zip \\\n    && rm -rf /var/lib/apt/lists/*\n\nCOPY --from=composer:2 /usr/bin/composer /usr/bin/composer\n\nRUN composer install --no-dev --optimize-autoloader\n\nCMD ["php-fpm"]\n''')

          if not os.path.exists('docker-compose.yml'):
              with open('docker-compose.yml', 'w', encoding='utf-8') as f:
                  f.write('''services:\n  app:\n    build: .\n    ports:\n      - "8080:80"\n''')
          PY

          echo "Final Docker files:"
          ls -l Dockerfile docker-compose.yml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags to publish
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_all }}" == "true" ]]; then
            tags=$(git tag --list | sort -V)
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tags="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tags="${{ github.ref_name }}"
          else
            tags="${{ github.ref_name }}"
          fi

          printf 'tags<<EOF\n%s\nEOF\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "Publishing $tag"
            docker build -t "$DOCKER_REPO:$tag" .
            docker push "$DOCKER_REPO:$tag"
          done <<< "${{ steps.tags.outputs.tags }}"

          latest_tag=$(git tag --list | sort -V | tail -n 1)
          if [[ -n "$latest_tag" ]]; then
            echo "Setting latest to $latest_tag"
            docker tag "$DOCKER_REPO:$latest_tag" "$DOCKER_REPO:latest"
            docker push "$DOCKER_REPO:latest"
          fi
